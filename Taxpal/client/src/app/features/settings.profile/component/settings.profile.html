<div class="sidebar">
  <div class="logo">
    <h1>Settings</h1>
    <p>Manage your account settings and preferences</p>
  </div>

  <div class="menu-section">
    <a class="menu-item active" routerLink="/settings/profile" routerLinkActive="active">
      <i></i> Profile
    </a>
    <a class="menu-item" routerLink="/settings/categories" routerLinkActive="active">
      <i></i> Categories
    </a>
    <div class="menu-item"><i></i> Notifications</div>
    <div class="menu-item"><i></i> Security</div>
  </div>
</div>

<div class="main-content">
  <div class="header">
    <h2>Profile</h2>

    <!-- ✕ Close button (top-right) -->
    <a
      class="btn-icon close-btn"
      routerLink="/dashboard"
      aria-label="Close and go to dashboard"
      title="Close"
    >✕</a>
  </div>

  <div *ngIf="error" class="error-message">{{ error }}</div>
  <div *ngIf="loading" class="loading-state">Loading profile…</div>

  <div class="profile-card" *ngIf="!loading">
    <div class="avatar-row">
      <div class="avatar">{{ (model.name || 'U').charAt(0) }}</div>
      <div class="user-meta">
        <div class="user-name">{{ model.name || 'User' }}</div>
        <div class="user-email">{{ model.email }}</div>
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label>Full name</label>
        <input [readonly]="viewOnly" [(ngModel)]="model.name" type="text" placeholder="Your full name" />
      </div>

      <div class="field">
        <label>Email address</label>
        <input [readonly]="viewOnly" [(ngModel)]="model.email" type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label>Country</label>
        <input [readonly]="viewOnly" [(ngModel)]="model.country" type="text" placeholder="US" />
      </div>

      <div class="field">
        <label>Income bracket</label>
        <select [disabled]="viewOnly" [(ngModel)]="model.income_bracket">
          <option value="low">Low</option>
          <option value="middle">Middle</option>
          <option value="high">High</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button *ngIf="viewOnly" class="btn btn-primary" (click)="enableEdit()">Edit Profile</button>

      <ng-container *ngIf="!viewOnly">
        <button class="btn btn-primary" (click)="save()" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Update Profile' }}
        </button>
        <button class="btn btn-secondary" (click)="cancel()" [disabled]="saving">Cancel</button>
      </ng-container>
    </div>
  </div>
</div>
