<!-- Page shell identical to Budgets -->
<div class="budgets-container">
  <main class="main-content">
    <!-- Header -->
    <header class="page-header">
      <h1 class="page-title">Tax Calendar</h1>
      <p class="page-subtitle">Upcoming estimated payments & reminders</p>
    </header>

    <!-- Card-like content area (same as Budgets form card) -->
    <section class="form-section">
      <div class="form-card">
        <!-- Your calendar content -->
        <div class="calendar">
          <!-- (Optional) keep a small section title if you want -->
          <!-- <h2 class="calendar__title">Tax Calendar</h2> -->

          <ng-container *ngFor="let section of sections">
            <div class="calendar__month">{{ section.monthLabel }}</div>

            <div class="calendar__list">
              <div class="card" *ngFor="let item of section.items">
                <div class="card__main">
                  <div class="card__title">
                    <span class="card__title-text">{{ item.title }}</span>
                    <span class="{{ badgeClass(item.type) }}">{{ item.type }}</span>
                  </div>

                  <div class="card__date">
                    {{ item.date | date:'MMM d, y' }}
                  </div>

                  <div class="card__note" *ngIf="item.note">
                    {{ item.note }}
                  </div>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </section>
  </main>
</div>
