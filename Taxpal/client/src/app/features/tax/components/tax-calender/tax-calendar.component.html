<div class="budgets-container">
  <main class="main-content">
    <!-- Header -->
    <header class="page-header">
      <h1 class="page-title">Tax Calendar</h1>
      <p class="page-subtitle">Upcoming estimated payments & reminders</p>
    </header>

    <section class="form-section">
      <div class="form-card">
        <div class="form-card-header" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <h2 class="form-card-title" style="margin:0;">Quarterly Schedule</h2>

          <div style="display:flex; align-items:center; gap:8px;">
            <!-- ✅ Delete All Reminders -->
            <button
              type="button"
              class="btn btn-danger"
              [disabled]="bulkBusy || loading"
              (click)="deleteAllReminders()">
              {{ bulkBusy ? 'Deleting…' : 'Delete All Reminders' }}
            </button>

            <button type="button" class="btn btn-primary btn-calc-tax" (click)="goToEstimator()">
              Calculate Tax
            </button>
            <button
              type="button"
              class="icon-btn"
              aria-label="Close tax calendar"
              (click)="onClose()">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6l-12 12" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Status -->
        <div *ngIf="loading" class="status-banner status--loading" style="margin-bottom:8px;">
          Loading events from server…
        </div>
        <div *ngIf="!loading && error" class="status-banner status--err" style="margin-bottom:8px;">
          {{ error }}
        </div>
        <div *ngIf="!loading && bulkMsg" class="status-banner" [ngClass]="{'status--ok': !error, 'status--loading': bulkBusy}" style="margin-bottom:8px;">
          {{ bulkMsg }}
        </div>

        <!-- Calendar content -->
        <div class="calendar" *ngIf="!loading && !error">
          <ng-container *ngIf="sections.length; else empty">
            <ng-container *ngFor="let section of sections">
              <div class="calendar__month">{{ section.monthLabel }}</div>

              <div class="calendar__list">
                <div class="card" *ngFor="let item of section.items">
                  <div class="card__main">
                    <div class="card__title">
                      <span class="card__title-text">{{ item.title }}</span>
                      <span [ngClass]="badgeClass(item.type)">{{ item.type }}</span>
                    </div>

                    <div class="card__date">
                      {{ item.date | date:'MMM d, y' }}
                    </div>

                    <div class="card__note" *ngIf="item.note">
                      {{ item.note }}
                    </div>

                    <!-- ✅ Actions -->
                    <div class="card__actions" *ngIf="item.type === 'payment'">
                      <button
                        type="button"
                        class="btn btn-success"
                        [disabled]="isCompleting(item._id)"
                        (click)="markComplete(item)">
                        {{ isCompleting(item._id) ? 'Completing…' : 'Mark Complete' }}
                      </button>
                    </div>

                    <!-- ✅ NEW: Delete single reminder -->
                    <div class="card__actions" *ngIf="item.type === 'reminder'">
                      <button
                        type="button"
                        class="btn btn-danger"
                        [disabled]="isDeleting(item._id)"
                        (click)="deleteReminder(item)">
                        {{ isDeleting(item._id) ? 'Deleting…' : 'Delete' }}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </ng-container>
          </ng-container>

          <ng-template #empty>
            <div class="recent-empty" style="padding:12px 0;">
              No calendar events yet.
            </div>
          </ng-template>
        </div>
      </div>
    </section>
  </main>
</div>
