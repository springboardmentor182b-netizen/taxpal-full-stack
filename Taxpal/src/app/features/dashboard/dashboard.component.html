<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Welcome to your TaxPal dashboard!</p>
  </div>
  
  <div class="dashboard-content">
    <div class="dashboard-stats">
      <div class="stat-card">
        <h3>Total Income</h3>
        <p class="stat-value income">$0.00</p>
      </div>
      <div class="stat-card">
        <h3>Total Expenses</h3>
        <p class="stat-value expense">$0.00</p>
      </div>
      <div class="stat-card">
        <h3>Net Income</h3>
        <p class="stat-value net">$0.00</p>
      </div>
    </div>
    
    <div class="dashboard-actions">
      <a routerLink="/transactions" class="action-button">View Transactions</a>
      <a routerLink="/budgets" class="action-button">Manage Budgets</a>
      <a routerLink="/tax" class="action-button">Tax Calculator</a>
      <a routerLink="/reports" class="action-button">Generate Reports</a>
    </div>
  </div>
</div>
