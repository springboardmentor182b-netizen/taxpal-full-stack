

<div *ngIf="showModal" class="modal-overlay">
  <div class="modal-content">
    <h2 class="modal-title">Category Management</h2>

    <!-- Tabs -->
    <div class="tabs">
      <button [class.active]="selectedTab==='Expense'" (click)="selectedTab='Expense'">Expense Categories</button>
      <button [class.active]="selectedTab==='Income'" (click)="selectedTab='Income'">Income Categories</button>
    </div>

    <!-- Category list -->
    <ul class="category-list">
      <li *ngFor="let cat of categories" [hidden]="cat.type !== selectedTab">
        <span class="dot"></span>
        <span class="cat-name">{{ cat.name }}</span>
        <div class="actions">
          <button (click)="editCategory(cat)" class="edit-btn">✎</button>
          <button (click)="deleteCategory(cat)" class="delete-btn">✖</button>
        </div>
      </li>
    </ul>

    <!-- Add/Edit Form -->
    <form [formGroup]="categoryForm" (ngSubmit)="addOrUpdateCategory()" class="category-form">
      <input formControlName="name" placeholder="Category Name" />
      <select formControlName="type">
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
      </select>
      <div class="form-buttons">
        <button type="button" (click)="closeModal()">Cancel</button>
        <button type="submit" class="add-btn">{{ editingCategory ? 'Update' : 'Add' }}</button>
      </div>
    </form>
  </div>
</div>
