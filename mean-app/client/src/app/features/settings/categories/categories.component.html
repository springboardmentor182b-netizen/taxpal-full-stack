<div class="settings-root">
  <!-- Sidebar -->
  <aside class="settings-sidebar">
    <ul>
      <li [class.active]="activeTab==='profile'" (click)="setTab('profile')">Profile</li>
      <li [class.active]="activeTab==='categories'" (click)="setTab('categories')">Categories</li>
      <li [class.active]="activeTab==='notifications'" (click)="setTab('notifications')">Notifications</li>
      <li [class.active]="activeTab==='security'" (click)="setTab('security')">Security</li>
    </ul>
  </aside>

  <!-- Main content -->
  <div class="settings-content">
    <h2>Settings</h2>

    <!-- Categories Tab -->
    <div *ngIf="activeTab==='categories'">
      <h3>Category Management</h3>

      <mat-tab-group>
        <!-- Expense Categories -->
        <mat-tab label="Expense Categories">
          <ul class="category-list">
            <li *ngFor="let cat of expenseCategories; trackBy: trackById">
              <div class="cat-info">
                <span class="dot" [style.backgroundColor]="cat.color || '#1976d2'"></span>
                <span>{{ cat.name }}</span>
              </div>
              <div class="actions">
                <button mat-icon-button color="primary" (click)="editCategory(cat)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteCategory(cat)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </li>
          </ul>
        </mat-tab>

        <!-- Income Categories -->
        <mat-tab label="Income Categories">
          <ul class="category-list">
            <li *ngFor="let cat of incomeCategories; trackBy: trackById">
              <div class="cat-info">
                <span class="dot" [style.backgroundColor]="cat.color || '#388e3c'"></span>
                <span>{{ cat.name }}</span>
              </div>
              <div class="actions">
                <button mat-icon-button color="primary" (click)="editCategory(cat)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteCategory(cat)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </li>
          </ul>
        </mat-tab>
      </mat-tab-group>

      <!-- Add Category -->
      <div class="add-category">
        <mat-form-field>
          <input matInput placeholder="Category name" [(ngModel)]="newCategoryName" />
        </mat-form-field>

        <mat-form-field>
          <mat-select [(ngModel)]="newCategoryType" placeholder="Select Type">
            <mat-option value="expense">Expense</mat-option>
            <mat-option value="income">Income</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field>
          <input matInput type="color" [(ngModel)]="newCategoryColor" />
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          (click)="addCategory()" 
          [disabled]="!newCategoryName.trim() || !newCategoryType">
          + Add New Category
        </button>
      </div>
    </div>
  </div>
</div>
