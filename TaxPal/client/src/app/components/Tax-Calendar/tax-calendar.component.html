<div class="dashboard-container">
  <div class="dashboard-content">
    <div class="welcome-section">
      <h1>Tax Calendar</h1>
      <p class="subtitle">View quarterly tax reminders and due dates</p>
    </div>

    <div class="dashboard-placeholder">
      <div class="placeholder-icon">
        <i class="fa-solid fa-calendar-days fa-2x"></i>
      </div>

      <h2>Upcoming Tax Deadlines</h2>

      <div *ngFor="let reminder of taxReminders" class="calendar-item">
        <div class="calendar-info">
          <strong>{{ reminder.title }}</strong><br>
          <small>{{ reminder.date | date: 'MMM d, y' }}</small>
        </div>
        <span class="tag" [ngClass]="reminder.type">{{ reminder.type }}</span>
      </div>
    </div>
  </div>
</div>
