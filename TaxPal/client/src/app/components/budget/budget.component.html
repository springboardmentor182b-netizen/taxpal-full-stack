<div class="budget-page">
    <!-- Main content area -->
    <main class="budget-main">
        <div class="budget-container">
            <div class="form-section">
                <div class="form-card" role="dialog" aria-labelledby="createBudgetTitle" aria-modal="true">
                    <div class="form-card-header">
                        <h2 id="createBudgetTitle" class="form-card-title">Create New Budget</h2>
                    </div>

                    <!-- Bind to Angular form -->
                    <form class="budget-form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off">
                        <!-- Row 1: Category & Amount -->
                        <div class="grid grid-2">
                            <div class="form-group">
                                <label for="category">Category</label>
                                <div class="select-wrap">
                                    <select id="category" class="input" formControlName="category">
                                        <option value="" disabled>Select a category</option>
                                        <option *ngFor="let c of categories" [value]="c">{{c}}</option>
                                    </select>
                                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none"
                                            stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="amount">Budget Amount</label>
                                <div class="currency-wrap">
                                    <span class="currency-prefix">$</span>
                                    <input id="amount" type="number" step="0.01" min="0" placeholder="0.00"
                                        class="input pl-currency" formControlName="amount" />
                                </div>
                            </div>
                        </div>

                        <!-- Row 2: Date -->
                        <div class="grid grid-1">
                            <div class="form-group">
                                <label for="month">Date</label>
                                <input id="month" type="date" placeholder="dd-mm-yyyy" class="input"
                                    formControlName="month" />
                            </div>
                        </div>

                        <!-- Row 3: Description -->
                        <div class="form-group">
                            <label for="description">Description (Optional)</label>
                            <textarea id="description" rows="3" class="input textarea" formControlName="description"
                                placeholder="Add any additional details..."></textarea>
                        </div>

                        <!-- Actions -->
                        <div class="actions">
                            <a routerLink="/dashboard" class="btn btn-ghost">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Budget</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Budgets List -->
            <div class="form-card" style="margin-top:16px" *ngIf="budgets?.length">
                <div class="form-card-header">
                    <h2 class="form-card-title">Your Budgets</h2>
                </div>
                <div class="budget-form" style="padding-top:16px">
                    <div class="budget-table">
                        <div class="budget-row budget-head">
                            <div>Category</div>
                            <div>Limit</div>
                            <div>Month</div>
                            <div>Description</div>
                        </div>
                        <div class="budget-row" *ngFor="let b of budgets">
                            <div>{{ b.category }}</div>
                            <div>${{ b.limit | number:'1.2-2' }}</div>
                            <div>{{ (b.month || (b.createdAt | date:'yyyy-MM')) | date:'MMM, yyyy' }}</div>
                            <div>{{ b.description || '-' }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
