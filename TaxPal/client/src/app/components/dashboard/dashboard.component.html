<div class="dashboard-container" [ngClass]="{'dark': isDarkMode}">
  <div class="dashboard-content">
    <div class="welcome-section">
      <h1>Your Transactions</h1>
      <p class="subtitle">View and manage your income and expenses.</p>
    </div>
    <div class="transactions-section">
      <table class="transactions-table" *ngIf="transactions.length > 0; else noTransactions">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Type</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tx of transactions">
            <td>{{ tx.date | date:'shortDate' }}</td>
            <td>{{ tx.description }}</td>
            <td>{{ tx.category }}</td>
            <td>{{ tx.type }}</td>
            <td [class]="tx.type === 'income' ? 'income' : 'expense'">${{ tx.amount }}</td>
          </tr>
        </tbody>
      </table>
      <ng-template #noTransactions>
        <div class="no-transactions">
          <p>No transactions found. Add some to get started!</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>
